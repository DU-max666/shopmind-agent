# 智铺 ShopMind 本地一体化编排：API + Streamlit 演示端 + MySQL + Redis + Milvus
# 启动（deploy 目录）：docker compose up -d
# 首次启动后灌库：docker compose exec api python -m scripts.init_kb
version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SHOPMIND_API_KEY: ${SHOPMIND_API_KEY:-demo-key}
      SHOPMIND_RATE_QPS: "10"
      MYSQL_DSN: mysql+pymysql://shopmind:shopmind@mysql:3306/shopmind
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-shopmind-default-model}
    depends_on:
      - mysql
      - redis
      - milvus
    restart: unless-stopped

  streamlit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: shopmind-api
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ../frontend:/srv/shopmind/frontend:ro
      - ../eval:/srv/shopmind/eval:ro
    depends_on:
      - api
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopmind
      MYSQL_USER: shopmind
      MYSQL_PASSWORD: shopmind
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # --- Milvus standalone（含 etcd + minio 依赖）---
  etcd:
    image: milvusdb/etcd:3.5.14-docker23
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd-data:/etcd
    command: etcd --advertise-client-urls=http://etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-28T07-17-25Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
